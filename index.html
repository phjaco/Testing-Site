<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>
:root {
  --bg: #F4E1C1;
  --text: #7B5E57;
  --accent: #D4A373;
  --accent-light: #E5C48D;
}

/* ---------------- RESET ---------------- */

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

/* ---------------- NAV ---------------- */

.nav {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.nav a {
  color: var(--accent);
  text-decoration: none;
  margin: 0 1rem;
  position: relative;
}

.nav a::after {
  content: "";
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--accent-light);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s ease;
}

.nav a:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

/* ---------------- CONTENT ---------------- */

#content {
  padding: 6rem 2rem;
  width: 100%;
  box-sizing: border-box;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* ---------------- BLOCK SYSTEM ---------------- */

.block {
  padding: 3rem 0;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.block.visible {
  opacity: 1;
  transform: translateY(0);
}

.block:last-child {
  border-bottom: none;
}

/* Two-column layout */
.block.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5rem;
  align-items: center;
}

.block.two-col.reverse {
  direction: rtl;
}
.block.two-col.reverse > * {
  direction: ltr;
}

/* Full-width layout */
.block.full {
  max-width: 800px;
  margin: 0 auto;
}

/* Responsive */
@media (max-width: 768px) {
  .block.two-col {
    grid-template-columns: 1fr;
  }
}

/* ---------------- TEXT ---------------- */

.text h2 {
  margin-top: 0;
}

.text p {
  line-height: 1.6;
}

/* ---------------- IMAGES ---------------- */

.image {
  text-align: center;
}

.image img {
  max-width: 100%;
  border-radius: 10px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.12);
}

/* Optional smaller image */
.img-small img {
  max-width: 280px;
}

/* ---------------- CAROUSEL ---------------- */

.carousel {
  position: relative;
  max-width: 420px;
  margin: 0 auto;
  overflow: hidden;
}

.carousel-track {
  display: flex;
  transition: transform 0.5s ease;
}

.carousel-track img {
  min-width: 100%;
  border-radius: 10px;
}

.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 0.6rem;
  margin-top: 0.75rem;
}

.carousel-dots button {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.3);
  cursor: pointer;
}

.carousel-dots button.active {
  background: var(--accent);
  transform: scale(1.3);
}
</style>
</head>

<body>

<nav class="nav">
  <a href="#home" data-link>Home</a>
  <a href="#projects" data-link>Projects</a>
  <a href="#contact" data-link>Contact</a>
</nav>

<main id="content">

<!-- ================= HOME ================= -->

<section id="home" class="page active">

  <div class="block two-col visible">
    <div class="text">
      <h2>Welcome</h2>
      <p>This portfolio highlights selected projects and design work.</p>
    </div>
    <div class="image img-small">
      <img src="/images/home.png">
    </div>
  </div>

</section>

<!-- ================= PROJECTS ================= -->

<section id="projects" class="page">

  <!-- Text + Image -->
  <div class="block two-col">
    <div class="text">
      <h2>Project One</h2>
      <p>A clean two-column layout with a single image.</p>
    </div>
    <div class="image">
      <img src="/images/proj/proj1.png">
    </div>
  </div>

  <!-- Text + Carousel -->
  <div class="block two-col reverse">
    <div class="text">
      <h2>Project Gallery</h2>
      <p>This project uses a carousel to show multiple views.</p>
    </div>

    <div class="carousel" data-carousel>
      <div class="carousel-track">
        <img src="/images/proj/proj1-1.png">
        <img src="/images/proj/proj1-2.png">
        <img src="/images/proj/proj1-3.png">
        <img src="/images/proj/proj1-4.png">
        <img src="/images/proj/proj1-5.png">
      </div>
      <div class="carousel-dots"></div>
    </div>
  </div>

  <!-- Full-width carousel -->
  <div class="block full">
    <div class="carousel" data-carousel>
      <div class="carousel-track">
        <img src="/images/proj/proj2-1.png">
        <img src="/images/proj/proj2-2.png">
        <img src="/images/proj/proj2-3.png">
      </div>
      <div class="carousel-dots"></div>
    </div>
  </div>

</section>

<!-- ================= CONTACT ================= -->

<section id="contact" class="page">

  <div class="block full">
    <div class="text">
      <h2>Contact</h2>
      <p>Email: you@example.com</p>
    </div>
  </div>

</section>

</main>

<script>
const pages = document.querySelectorAll(".page");
const links = document.querySelectorAll(".nav a");

function showPage(id) {
  pages.forEach(p => p.classList.remove("active"));
  const page = document.getElementById(id);
  page.classList.add("active");

  const blocks = page.querySelectorAll(".block");
  blocks.forEach(b => b.classList.remove("visible"));
  blocks.forEach((b, i) =>
    setTimeout(() => b.classList.add("visible"), i * 150)
  );

  history.pushState(null, "", "#" + id);
}

links.forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    showPage(link.getAttribute("href").substring(1));
  });
});

window.addEventListener("popstate", () => {
  showPage(location.hash.substring(1) || "home");
});

/* -------- CAROUSELS -------- */

function initCarousels() {
  document.querySelectorAll("[data-carousel]").forEach(carousel => {
    if (carousel.dataset.ready) return;
    carousel.dataset.ready = "true";

    const track = carousel.querySelector(".carousel-track");
    const slides = [...track.children];
    const dots = carousel.querySelector(".carousel-dots");
    let index = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.onclick = () => {
        index = i;
        update();
      };
      dots.appendChild(dot);
    });

    function update() {
      track.style.transform = `translateX(-${index * 100}%)`;
      [...dots.children].forEach(d => d.classList.remove("active"));
      dots.children[index].classList.add("active");
    }

    update();
  });
}

initCarousels();
</script>

</body>
</html>
